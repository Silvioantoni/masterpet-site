<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ative sua MasterPET</title>
<style>
:root{--bg:#04100a;--card:#0d1913;--line:#294237;--green:#79ff00;--text:#f7faf8;--muted:#a9b7ae;--danger:#ff3657}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#0a2213 0,#04100a 35%,#030705 100%);color:var(--text);font-family:Arial,Helvetica,sans-serif}
a{color:inherit;text-decoration:none}.wrap{max-width:1040px;margin:auto;padding:0 20px}
header{height:84px;border-bottom:1px solid #1a2921;background:#050806}.head{height:84px;display:flex;align-items:center;justify-content:center}.logo{font-size:25px;font-weight:900;letter-spacing:-.7px}.logo b{color:var(--green)}
.card{max-width:620px;margin:38px auto 70px;background:linear-gradient(145deg,#102017,#09110d);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 24px 70px #0007}
.badge{display:inline-block;border:1px solid #38563f;color:var(--green);padding:7px 11px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.35px}
h1{font-size:34px;line-height:1.08;margin:18px 0 8px}.sub{margin:0 0 20px;color:var(--muted);line-height:1.5}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.full{grid-column:1/-1}
.field{margin:0 0 13px}label{display:block;font-size:13px;color:#dae5de;margin:0 0 7px}input,select{width:100%;background:#06100a;border:1px solid #31493c;color:#fff;border-radius:11px;padding:13px 14px;font-size:15px;outline:none}input:focus,select:focus{border-color:var(--green)}
.actions{margin-top:8px}button{width:100%;min-height:50px;background:var(--green);color:#071000;border:0;border-radius:12px;font-weight:900;font-size:15px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
.status{display:none;margin:16px 0 0;padding:14px;border-radius:11px;font-size:14px;line-height:1.45}.status.ok{display:block;background:#10351b;border:1px solid #3f9444;color:#d8ffd0}.status.err{display:block;background:#33141c;border:1px solid #7e3041;color:#ffc1cb}
.login{text-align:center;margin-top:18px;color:var(--muted)}.login a{color:var(--green);font-weight:800}.note{font-size:12px;color:#83968c;margin-top:16px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{margin-top:24px;padding:22px}h1{font-size:30px}}
</style></head><body>
<header><div class="wrap head"><div class="logo">MASTER<b>PET</b></div></div></header>
<main class="wrap"><section class="card">
<div class="badge">🐾 ATIVAÇÃO DA TAG</div>
<h1>Ative sua MasterPET</h1>
<p class="sub">Cadastre sua conta e vincule a tag ao seu pet.</p>
<div id="status" class="status"></div>
<div class="grid">
<div class="field"><label for="tagId">ID da tag</label><input id="tagId" placeholder="Ex.: MP-0003" autocomplete="off"></div>
<div class="field"><label for="code">Código de ativação</label><input id="code" placeholder="Ex.: BJEBR-42RP7" autocomplete="off"></div>
<div class="field"><label for="name">Seu nome</label><input id="name" autocomplete="name"></div>
<div class="field"><label for="wa">WhatsApp</label><input id="wa" placeholder="45999999999" inputmode="numeric" autocomplete="tel"></div>
<div class="field full"><label for="email">E-mail</label><input id="email" type="email" autocomplete="email"></div>
<div class="field"><label for="pass">Senha</label><input id="pass" type="password" minlength="8" autocomplete="new-password"></div>
<div class="field"><label for="pass2">Confirmar senha</label><input id="pass2" type="password" minlength="8" autocomplete="new-password"></div>
<div class="field full"><label for="petName">Nome do pet</label><input id="petName"></div>
<div class="field"><label for="species">Espécie</label><select id="species"><option value="Cachorro">Cachorro</option><option value="Gato">Gato</option><option value="Outro">Outro</option></select></div>
<div class="field"><label for="sex">Sexo</label><select id="sex"><option value="NAO_INFORMADO">Não informado</option><option value="Macho">Macho</option><option value="Fêmea">Fêmea</option></select></div>
<div class="field full"><label for="breed">Raça</label><input id="breed" placeholder="Ex.: Yorkshire Terrier"></div>
</div>
<div class="note">A senha precisa ter pelo menos 8 caracteres. O código de ativação é exclusivo da sua tag.</div>
<div class="actions"><button id="activateBtn" onclick="activateTag()">ATIVAR MINHA MASTERPET</button></div>
<div class="login">Já tenho cadastro → <a href="/tutor/">Entrar</a></div>
</section></main>
<script>
const API='https://script.google.com/macros/s/AKfycbzSvScdkpr10U80-imp1zNI-72dN6RvB2eOlMUL40efJdd9eJrDrpwJfV6hCe4SB5w2Zg/exec';
const $=id=>document.getElementById(id);
function show(msg,ok){const e=$('status');e.className='status '+(ok?'ok':'err');e.textContent=msg;}
function val(id){return $(id).value.trim();}
function activateTag(){
 const tagId=val('tagId').toUpperCase(), code=val('code').toUpperCase();
 const name=val('name'), wa=val('wa'), email=val('email').toLowerCase(), pass=val('pass'), pass2=val('pass2');
 const petName=val('petName'), species=val('species'), sex=val('sex'), breed=val('breed');
 if(!/^MP-[A-Z0-9-]+$/.test(tagId)) return show('Informe um ID de tag válido, como MP-0003.',false);
 if(!code) return show('Informe o código de ativação da tag.',false);
 if(!name||!email||!wa) return show('Preencha seus dados de contato.',false);
 if(!/^\S+@\S+\.\S+$/.test(email)) return show('Informe um e-mail válido.',false);
 if(pass.length<8) return show('A senha precisa ter pelo menos 8 caracteres.',false);
 if(pass!==pass2) return show('As senhas não conferem.',false);
 if(!petName) return show('Informe o nome do seu pet.',false);
 const btn=$('activateBtn');btn.disabled=true;btn.textContent='ATIVANDO SUA MASTERPET...';show('Ativando sua MasterPET...',true);
 const frame=document.createElement('iframe');frame.name='mpActFrame_'+Date.now();frame.style.display='none';document.body.appendChild(frame);
 const form=document.createElement('form');form.target=frame.name;form.method='POST';form.action=API;
 const data={action:'activatetag',tagId,code,nomeTutor:name,whatsapp:wa,email,senha:pass,nomePet:petName,especie:species,sexo:sex,raca:breed};
 Object.entries(data).forEach(([n,v])=>{const i=document.createElement('input');i.type='hidden';i.name=n;i.value=v;form.appendChild(i);});
 document.body.appendChild(form);form.submit();form.remove();
 setTimeout(()=>confirmActivation(tagId,email,btn,frame),1800);
}
function confirmActivation(tagId,email,btn,frame){
 const cb='mpActCheck_'+Date.now();
 window[cb]=(data)=>{
   try{
     if(data&&data.ok&&data.pet){
       localStorage.setItem('masterpet_activation_message','Tag '+tagId+' ativada com sucesso. Faça login para acessar seu perfil.');
       show('✅ Sua MasterPET foi ativada! Redirecionando para a Área do Tutor...',true);
       setTimeout(()=>{location.href='/tutor/?activated=1&email='+encodeURIComponent(email)},900);
     }else if(data&&data.error==='TAG_NOT_FOUND'){show('Tag não encontrada. Confira o ID informado.',false);reset(btn,frame);}
     else if(data&&data.error==='TAG_CODE_INVALID'){show('Código de ativação inválido para esta tag.',false);reset(btn,frame);}
     else if(data&&data.error==='TAG_ALREADY_ACTIVE'){show('Essa tag já está ativa.',false);reset(btn,frame);}
     else {show('Não foi possível concluir a ativação. Confira os dados e tente novamente.',false);reset(btn,frame);}
   }catch(e){show('Não foi possível confirmar a ativação.',false);reset(btn,frame);}
 };
 const s=document.createElement('script');s.src=API+'?action=publicpet&tagId='+encodeURIComponent(tagId)+'&callback='+cb+'&_='+Date.now();document.body.appendChild(s);
 setTimeout(()=>{if(btn.disabled){show('A ativação foi enviada. Aguarde alguns segundos e consulte a Área do Tutor.',true);localStorage.setItem('masterpet_activation_message','Ativação enviada para '+tagId+'. Faça login na Área do Tutor para continuar.');setTimeout(()=>location.href='/tutor/?activated=1&email='+encodeURIComponent(email),1200);}},6500);
}
function reset(btn,frame){btn.disabled=false;btn.textContent='ATIVAR MINHA MASTERPET';setTimeout(()=>frame.remove(),500);}
</script></body></html>
