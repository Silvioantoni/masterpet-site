<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ativar sua MasterPET</title><style>body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#07100b;color:#fff}.wrap{max-width:520px;margin:0 auto;padding:24px}.brand{text-align:center;font-size:30px;font-weight:800;margin:18px 0 6px}.brand span{color:#58ff00}.sub{text-align:center;color:#9ca8a1;margin-bottom:26px}.card{background:#101916;border:1px solid #2a3933;border-radius:18px;padding:24px;box-shadow:0 20px 50px rgba(0,0,0,.25)}h1{font-size:28px;margin:0 0 6px}.muted{color:#9ca8a1}.grid{display:grid;gap:14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.row{grid-template-columns:1fr}}label{font-size:13px;color:#b7c2bc}input,select{width:100%;box-sizing:border-box;background:#07100d;color:#fff;border:1px solid #33453d;border-radius:10px;padding:13px;font-size:15px;margin-top:6px}button{width:100%;padding:14px;border:0;border-radius:11px;background:#58ff00;color:#051006;font-weight:800;font-size:16px;cursor:pointer}.note{font-size:12px;color:#93a39b;line-height:1.5}.msg{display:none;padding:13px;border-radius:10px;margin-bottom:14px}.ok{background:#123315;border:1px solid #4de24d;color:#baffba}.err{background:#35151a;border:1px solid #ff5265;color:#ffd1d6}.toplink{text-align:center;margin-top:18px}.toplink a{color:#58ff00;text-decoration:none}.step{display:inline-flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid #2c3b35;border-radius:999px;font-size:12px;margin-bottom:16px}</style></head><body><div class="wrap"><div class="brand">MASTER<span>PET</span></div><div class="sub">A identidade inteligente do seu pet</div><div class="card"><div class="step">🐾 ATIVAÇÃO DA TAG</div><h1>Ative sua MasterPET</h1><p class="muted">Cadastre sua conta e vincule a tag ao seu pet.</p><div id="msg" class="msg"></div><form id="form"><div class="row"><div><label>ID da tag</label><input id="tagId" name="tagId" placeholder="MP-0002" required></div><div><label>Código de ativação</label><input id="codigo" name="codigo" placeholder="ABCDE-12345" required></div></div><hr style="border:0;border-top:1px solid #25322e;margin:4px 0"><div class="row"><div><label>Seu nome</label><input id="nome" name="nome" required></div><div><label>WhatsApp</label><input id="whatsapp" name="whatsapp" placeholder="45999999999" required></div></div><div><label>E-mail</label><input id="email" name="email" type="email" required></div><div class="row"><div><label>Senha</label><input id="senha" name="senha" type="password" minlength="8" required></div><div><label>Confirmar senha</label><input id="senha2" name="senha2" type="password" minlength="8" required></div></div><hr style="border:0;border-top:1px solid #25322e;margin:4px 0"><div><label>Nome do pet</label><input id="petNome" name="petNome" required></div><div class="row"><div><label>Espécie</label><select id="especie" name="especie"><option>Cachorro</option><option>Gato</option><option>Outro</option></select></div><div><label>Sexo</label><select id="sexo" name="sexo"><option value="">Não informado</option><option>Fêmea</option><option>Macho</option></select></div></div><div><label>Raça</label><input id="raca" name="raca" placeholder="Yorkshire Terrier"></div><div class="note">A senha precisa ter pelo menos 8 caracteres. O código de ativação é exclusivo da sua tag.</div><button type="submit">ATIVAR MINHA MASTERPET</button></form><div class="toplink">Já tenho cadastro → <a href="/entrar/">Entrar</a></div></div><iframe name="mpRegFrame" id="mpRegFrame" style="display:none"></iframe></div><script>const API='https://script.google.com/macros/s/AKfycbzSvScdkpr10U80-imp1zNI-72dN6RvB2eOlMUL40efJdd9eJrDrpwJfV6hCe4SB5w2Zg/exec';const $=id=>document.getElementById(id);const msg=$('msg');window.addEventListener('message',e=>{if(e.origin!=='https://script.google.com'&&e.origin!=='https://script.googleusercontent.com')return;const d=e.data||{};show(d.ok?'ok':'err',d.ok?'Cadastro realizado! Você já pode entrar na sua conta.':errorText(d.error));if(d.ok){const em=$('email').value; $('form').reset(); setTimeout(()=>location.href='/entrar/?email='+encodeURIComponent(d.email||em),1000)}});function show(type,text){msg.className='msg '+type;msg.textContent=text;msg.style.display='block';window.scrollTo({top:0,behavior:'smooth'})}function errorText(e){return({INVALID_FORM:'Confira os campos e confirme as senhas.',TAG_NOT_FOUND:'Tag não encontrada.',INVALID_ACTIVATION_CODE:'Código de ativação inválido.',TAG_ALREADY_ACTIVATED:'Essa tag já foi ativada.',EMAIL_ALREADY_REGISTERED:'Este e-mail já possui uma conta.'}[e]||'Não foi possível concluir o cadastro.')}$('form').addEventListener('submit',e=>{e.preventDefault();if($('senha').value!==$('senha2').value){show('err','As senhas não coincidem.');return}const f=document.createElement('form');f.method='POST';f.action=API;f.target='mpRegFrame';[['action','register'],['tagId',''+$('tagId').value],['codigo',$('codigo').value],['nome',$('nome').value],['whatsapp',$('whatsapp').value],['email',$('email').value],['senha',$('senha').value],['senha2',$('senha2').value],['petNome',$('petNome').value],['especie',$('especie').value],['raca',$('raca').value],['sexo',$('sexo').value]].forEach(([n,v])=>{const i=document.createElement('input');i.name=n;i.value=v;f.appendChild(i)});document.body.appendChild(f);show('ok','Ativando sua MasterPET...');f.submit();setTimeout(()=>f.remove(),5000)});</script></body></html>
