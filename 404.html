<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
<link rel="dns-prefetch" href="https://drive.google.com">
<meta name="theme-color" content="#090b0c">
<title>MasterPET</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23090b0c%22/%3E%3Ctext x=%2232%22 y=%2242%22 font-family=%22Arial%22 font-weight=%22900%22 font-size=%2226%22 text-anchor=%22middle%22 fill=%22%2339ff00%22%3EMP%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f4f5;font-family:Arial,Helvetica,sans-serif;color:#111}
.app{width:100%;max-width:470px;margin:0 auto;background:#fff;min-height:100vh;box-shadow:0 0 25px #0001}
.hero{background:linear-gradient(145deg,#090b0c,#171a1b);color:#fff;text-align:center;padding:28px 22px 30px}
.logo{font-size:25px;font-weight:900;letter-spacing:-1px}.logo span{color:#39ff00}
.slogan{font-size:10px;letter-spacing:2px;color:#bfc6c8;margin-top:5px}
.petpic{width:120px;height:120px;border-radius:50%;margin:20px auto 12px;background:#f3f5f6;border:4px solid #39ff00;display:flex;align-items:center;justify-content:center;font-size:46px}
.petname{font-size:29px;font-weight:800;margin:0}.breed{color:#bdc4c7;margin-top:6px;font-size:14px}
.content{padding:18px}
.status{border:1px solid #9bef8b;background:#edffe9;border-radius:14px;padding:15px;margin-bottom:12px}
.status strong{display:block;font-size:16px}.dot{display:inline-block;width:13px;height:13px;border-radius:50%;background:#19bd35;margin-right:8px}
.btn{display:flex;width:100%;min-height:52px;align-items:center;justify-content:center;border:0;border-radius:12px;margin:10px 0;font-size:16px;font-weight:700;text-decoration:none;cursor:pointer}
.whats{background:#39ff00;color:#071000}.phone{background:#171a1b;color:#fff}
.card{border:1px solid #e0e4e6;border-radius:14px;padding:15px;margin-top:12px}.card h2{font-size:17px;margin:0 0 12px}
.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #edf0f1;font-size:14px}.row:last-child{border-bottom:0}.label{color:#6e777b}.value{font-weight:700;text-align:right}
.note{font-size:14px;line-height:1.5;color:#444}.footer{text-align:center;color:#92999c;font-size:11px;padding:25px}
.loading{text-align:center;padding:50px 20px;color:#555}
.cta{background:#39ff00;color:#071000}.ghost{background:#fff;color:#171a1b;border:1px solid #d5dadc}
.info{padding:18px;border:1px solid #e0e4e6;background:#f8fafb;border-radius:14px;line-height:1.5;font-size:14px;color:#333}.error{padding:18px;border:1px solid #f0caca;background:#fff5f5;border-radius:14px}
</style>
</head>
<body>
<div class="app">
<header class="hero">
  <div class="logo">MASTER<span>PET</span></div>
  <div class="slogan">A IDENTIDADE INTELIGENTE DO SEU PET</div>
  <div class="petpic" id="petpic">🐾</div>
  <h1 class="petname" id="petname">Carregando...</h1>
  <div class="breed" id="breed">Perfil MasterPET</div>
</header>

<main class="content" id="content">
  <div class="loading" id="loading">Buscando o perfil do pet...</div>
</main>
<div class="footer">MASTERPET<br>Uma solução da MasterTech</div>
</div>

<iframe name="mpAccessFrame" id="mpAccessFrame" style="display:none"></iframe>
<script>
// MASTERPET 404 V6: roteador das URLs /p/ID_TAG e /ID_TAG no GitHub Pages.
const API = "https://script.google.com/macros/s/AKfycbzSvScdkpr10U80-imp1zNI-72dN6RvB2eOlMUL40efJdd9eJrDrpwJfV6hCe4SB5w2Zg/exec";

// V6: NÃO existe mais tag padrão. Antes, qualquer URL sem ID válido (erro de digitação,
// /p/ vazio, link quebrado) abria o perfil da Flora (MP-0001) e registrava um acesso falso.
// Agora, sem ID reconhecido, mostramos "página não encontrada".
// Para testes sem gravar acesso no histórico, adicione ?noscan=1 à URL.

function getTagId(){
  // Produção principal: /p/MP-0001
  const path = window.location.pathname.replace(/\/+$/, "");
  let m = path.match(/\/p\/([^/]+)/i);
  if (m && m[1]) return decodeURIComponent(m[1]).toUpperCase();

  // Compatibilidade: /MP-0001
  m = path.match(/^\/((?:MP-)[A-Z0-9-]+)$/i);
  if (m && m[1]) return decodeURIComponent(m[1]).toUpperCase();

  // Testes e compatibilidade: ?tagId=MP-0001 ou ?tag=MP-0001
  const p = new URLSearchParams(window.location.search);
  const q = (p.get("tagId") || p.get("tag") || "").trim();
  return q.toUpperCase();
}

function isValidTagId(t){ return /^[A-Z]{2,5}-[A-Z0-9-]{1,20}$/.test(t); }

function esc(v){
  return String(v ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function normalizePhone(v){
  let n = String(v||"").replace(/\D/g,"");

  // WhatsApp Brasil: se vier apenas com DDD + número, adiciona +55.
  if(n.length === 10 || n.length === 11){
    n = "55" + n;
  }

  return n;
}

function render(data, tagId){
  if(!data || !data.pet){
    throw new Error("Tag não encontrada: "+tagId);
  }
  const p=data.pet;
  const contacts=Array.isArray(data.contatos)?data.contatos:[];
  const wa=contacts.find(x=>String(x.tipo).toUpperCase()==="WHATSAPP" && String(x.valor||"").trim());
  const phone=contacts.find(x=>String(x.tipo).toUpperCase()==="TELEFONE" && String(x.valor||"").trim()) || wa;
  const wnum=normalizePhone(wa?.valor);
  const pnum=normalizePhone(phone?.valor);
  const name=p.nome || "Pet";
  const status=String(p.status||"ATIVO").toUpperCase();
  const female=/^F/i.test(String(p.sexo||""));
  const art=female?"a":"o";

  document.title = "MasterPET — "+name;
  document.getElementById("petname").textContent=name;
  document.getElementById("breed").textContent=(p.raca||p.especie||"Pet")+" • Perfil MasterPET";
  if(p.foto){
    document.getElementById("petpic").innerHTML='<img src="'+esc(p.foto)+'" alt="'+esc(name)+'" style="width:100%;height:100%;object-fit:cover;border-radius:50%">';
  }

  const content=document.getElementById("content");
  let buttons="";
  if(wnum) buttons += '<a class="btn whats" target="_blank" href="https://wa.me/'+wnum+'?text='+encodeURIComponent("Olá! Encontrei "+art+" "+name+". Estou entrando em contato pela MasterPET.")+'">💬 Falar com a família</a>';
  if(pnum) buttons += '<a class="btn phone" href="tel:+'+pnum+'">📞 Ligar para a família</a>';

  const isLost = status === "PERDIDO" || status === "PET PERDIDO" || status === "LOST";
  const statusHtml = isLost
    ? '<div class="status" style="border-color:#ff5364;background:#fff0f2"><span class="dot" style="background:#ff3048"></span><strong style="color:#c9142c">🚨 '+esc(name)+' está '+(female?'PERDIDA':'PERDIDO')+'</strong><div style="margin-top:6px;color:#8a3a43;font-size:13px">Este pet foi marcado como perdido pelo tutor. Se você '+(female?'a':'o')+' encontrou, entre em contato com a família.</div>'+(p.mensagemPerdido?'<div style="margin-top:10px;padding:10px;border-radius:10px;background:#fff;border:1px solid #ffc7cf;color:#5a1f27;font-size:14px;line-height:1.45"><b>Mensagem da família:</b><br>'+esc(p.mensagemPerdido)+'</div>':'')+'</div>'
    : '<div class="status"><span class="dot"></span><strong>'+esc(name)+' está '+(female?'identificada':'identificado')+'</strong><div style="margin-top:6px;color:#527052;font-size:13px">Este pet possui uma identificação MasterPET ativa.</div></div>';

  content.innerHTML =
    statusHtml+
    buttons+
    (isLost?'<button class="btn ghost" type="button" onclick="shareProfile()">📤 Compartilhar este alerta</button>':'')+
    '<section class="card"><h2>🐾 Sobre o pet</h2>'+
      '<div class="row"><span class="label">Nome</span><span class="value">'+esc(p.nome)+'</span></div>'+
      '<div class="row"><span class="label">Raça</span><span class="value">'+esc(p.raca||"-")+'</span></div>'+
      '<div class="row"><span class="label">Espécie</span><span class="value">'+esc(p.especie||"-")+'</span></div>'+
      '<div class="row"><span class="label">Sexo</span><span class="value">'+esc(p.sexo||"-")+'</span></div>'+
      '<div class="row"><span class="label">ID da tag</span><span class="value">'+esc(p.tag||tagId)+'</span></div>'+
    '</section>'+
    '<section class="card"><h2>❤️ Ajude a família</h2><p class="note">Se você encontrou este pet, entre em contato pelos canais disponíveis acima. A MasterPET protege os dados privados da família.</p></section>';
}


function shareProfile(){
  const url=location.origin+'/p/'+encodeURIComponent(getTagId());
  const name=document.getElementById('petname').textContent;
  const text='🚨 PET PERDIDO: '+name+'. Se você viu, fale com a família pelo perfil MasterPET: '+url;
  if(navigator.share) navigator.share({title:'MasterPET — '+name,text,url}).catch(()=>{});
  else window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
}

function registrarAcesso(tagId){
  // Registra o escaneamento sem solicitar localização ao visitante.
  // A privacidade vem primeiro: localização só deve ser compartilhada mediante ação explícita.
  try{
    const form=document.createElement('form');
    form.method='POST'; form.action=API; form.target='mpAccessFrame'; form.style.display='none';
    const fields={action:'recordscan',tagId:tagId,acao:'VISUALIZOU_PERFIL',locationAuthorized:'false'};
    Object.keys(fields).forEach(k=>{const i=document.createElement('input');i.type='hidden';i.name=k;i.value=fields[k];form.appendChild(i);});
    document.body.appendChild(form);
    form.submit();
    setTimeout(()=>form.remove(),2500);
  }catch(e){}
}

// ===== Perfil salvo no aparelho (stale-while-revalidate) =====
const SAVED_MAX_MS=7*24*3600*1000;
function readSaved(tagId){
  try{ const o=JSON.parse(localStorage.getItem("mp_pub_"+tagId)||"null"); if(o&&o.t&&Date.now()-o.t<SAVED_MAX_MS&&o.d&&o.d.ok) return o.d; }catch(e){}
  return null;
}
function keepSaved(tagId,data){ try{ const d=Object.assign({},data); delete d.cache; localStorage.setItem("mp_pub_"+tagId,JSON.stringify({t:Date.now(),d})); }catch(e){} }
function forgetSaved(tagId){ try{ localStorage.removeItem("mp_pub_"+tagId); }catch(e){} }
function savedNotice(){
  const c=document.getElementById("content"); if(!c||document.getElementById("savedNote")) return;
  c.insertAdjacentHTML("afterbegin",'<div id="savedNote" class="info" style="margin-bottom:12px;font-size:13px">📶 Sem conexão com o servidor agora. Mostrando o último perfil salvo neste aparelho. <a href="#" onclick="location.reload();return false" style="color:#1a7f00;font-weight:700">Tentar de novo</a></div>');
}

function load(){
  const tagId=getTagId();
  if(!tagId || !isValidTagId(tagId)){ showNotFoundPage(); return; }
  const noScan=new URLSearchParams(window.location.search).get("noscan")==="1";
  // Perfil salvo neste aparelho (só dados públicos): aparece na hora e é atualizado logo em seguida.
  const saved=readSaved(tagId);
  let showingSaved=false;
  if(saved){ try{ render(saved,tagId); showingSaved=true; }catch(e){} }
  if(!showingSaved) document.getElementById("content").innerHTML='<div class="loading" id="loading">Buscando o perfil do pet...</div>';

  // JSONP é usado primeiro para funcionar de forma consistente no Safari/iPhone,
  // onde chamadas cross-origin ao Apps Script podem ficar presas no carregamento.
  const callbackName = "masterPetCallback_" + Date.now();
  const script = document.createElement("script");
  // O servidor às vezes demora. Aos 10 s avisamos que está lento, mas continuamos esperando a resposta até 45 s.
  const slow = setTimeout(() => {
    const l=document.getElementById("loading");
    if(l) l.textContent="A conexão está lenta, ainda buscando o perfil do pet...";
  }, 10000);
  const timeout = setTimeout(() => {
    clearTimeout(slow);
    script.remove();
    window[callbackName] = function(){ delete window[callbackName]; };
    if(showingSaved){ savedNotice(); return; }
    showLoadError("Tempo esgotado ao carregar o perfil.");
  }, 45000);

  window[callbackName] = function(data){
    clearTimeout(timeout); clearTimeout(slow);
    script.remove();
    delete window[callbackName];
    try {
      if(data && data.error==="TAG_NOT_FOUND"){ forgetSaved(tagId); showNotActivated(tagId); return; }
      if(data && data.error==="TAG_BLOCKED"){ forgetSaved(tagId); showBlocked(tagId); return; }
      if(!data || !data.ok) throw new Error(data?.error || "Não foi possível carregar a tag.");
      render(data,tagId);
      keepSaved(tagId,data);
      if(!noScan) registrarAcesso(tagId);
    } catch(e) {
      if(showingSaved){ savedNotice(); return; }
      showLoadError(e.message);
    }
  };

  script.onerror = function(){
    clearTimeout(timeout); clearTimeout(slow);
    script.remove();
    delete window[callbackName];
    if(showingSaved){ savedNotice(); return; }
    showLoadError("Não foi possível conectar ao servidor.");
  };

  script.src = API + "?action=publicPet&tagId=" + encodeURIComponent(tagId) + "&callback=" + encodeURIComponent(callbackName) + "&_=" + Date.now();
  document.head.appendChild(script);
}

function showLoadError(message){
  const tagId=getTagId();
  document.getElementById("petname").textContent="MasterPET";
  document.getElementById("breed").textContent="Não foi possível carregar";
  document.getElementById("content").innerHTML='<div class="error"><strong>Não conseguimos carregar esta tag agora.</strong><p style="margin-bottom:0">Tag consultada: <b>'+esc(tagId)+'</b><br><br>'+esc(message)+'<br>Verifique sua conexão com a internet e tente novamente.</p></div>'+
    '<button class="btn whats" type="button" onclick="load()">🔄 Tentar novamente</button>';
}

// Tag existe fisicamente mas ainda não foi ativada (ou o ID não existe).
// O backend responde TAG_NOT_FOUND nos dois casos. Quem acabou de comprar a tag
// e escaneou o QR cai aqui e é levado direto para a ativação.
function showNotActivated(tagId){
  document.title="MasterPET — Ativar "+tagId;
  document.getElementById("petname").textContent=tagId;
  document.getElementById("breed").textContent="Tag ainda não ativada";
  document.getElementById("content").innerHTML=
    '<div class="info"><strong>Esta tag MasterPET ainda não está ativa.</strong><br>Se você acabou de receber sua tag, ative agora para criar o perfil do seu pet. Tenha em mãos o <b>código de ativação</b> que acompanha a tag.</div>'+
    '<a class="btn cta" href="/ativar/?tagId='+encodeURIComponent(tagId)+'">🐾 Ativar minha MasterPET</a>'+
    '<a class="btn ghost" href="/">Conhecer a MasterPET</a>'+
    '<p class="note" style="text-align:center;font-size:12px;color:#8a9295">Encontrou um pet com esta tag? A família ainda não concluiu o cadastro.</p>';
}

function showBlocked(tagId){
  document.title="MasterPET — Tag desativada";
  document.getElementById("petname").textContent=tagId;
  document.getElementById("breed").textContent="Tag desativada";
  document.getElementById("content").innerHTML=
    '<div class="info"><strong>Esta tag MasterPET foi desativada.</strong><br>Ela pode ter sido perdida, substituída ou estar em análise. Se você encontrou um pet usando esta tag, fale com a MasterPET pelo WhatsApp que ajudamos a localizar a família.</div>'+
    '<a class="btn whats" target="_blank" href="https://wa.me/554599893990?text='+encodeURIComponent("Olá! Encontrei um pet com a tag MasterPET "+tagId+", que aparece como desativada.")+'">💬 Falar com a MasterPET</a>';
}

function showNotFoundPage(){
  document.title="MasterPET — Página não encontrada";
  document.getElementById("petname").textContent="Página não encontrada";
  document.getElementById("breed").textContent="Verifique o endereço digitado";
  document.getElementById("content").innerHTML=
    '<div class="info">O endereço acessado não corresponde a nenhuma página ou tag MasterPET. Os perfis de pets têm o formato <b>masterpet.tec.br/p/MP-0000</b>.</div>'+
    '<a class="btn cta" href="/">Ir para a página inicial</a>'+
    '<a class="btn phone" href="/tutor/">Área do Tutor</a>';
}


load();
</script>
</body>
</html>
