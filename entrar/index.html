<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — MasterPET</title><style>body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#07100b;color:#fff}.wrap{max-width:430px;margin:0 auto;padding:28px 20px}.brand{text-align:center;font-size:30px;font-weight:800;margin:25px 0 6px}.brand span{color:#58ff00}.sub{text-align:center;color:#9ca8a1;margin-bottom:28px}.card{background:#101916;border:1px solid #2a3933;border-radius:18px;padding:26px}h1{margin:0 0 6px;font-size:27px}.muted{color:#9ca8a1}.grid{display:grid;gap:15px}label{font-size:13px;color:#b7c2bc}input{width:100%;box-sizing:border-box;background:#07100d;color:#fff;border:1px solid #33453d;border-radius:10px;padding:13px;font-size:15px;margin-top:6px}button{width:100%;padding:14px;border:0;border-radius:11px;background:#58ff00;color:#051006;font-weight:800;font-size:16px;cursor:pointer}.msg{display:none;padding:13px;border-radius:10px;margin-bottom:14px}.ok{background:#123315;border:1px solid #4de24d;color:#baffba}.err{background:#35151a;border:1px solid #ff5265;color:#ffd1d6}.links{text-align:center;margin-top:18px}.links a{color:#58ff00;text-decoration:none}</style></head><body><div class="wrap"><div class="brand">MASTER<span>PET</span></div><div class="sub">A identidade inteligente do seu pet</div><div class="card"><h1>Entrar</h1><p class="muted">Acesse seu painel MasterPET.</p><div id="msg" class="msg"></div><div class="grid"><div><label>E-mail</label><input id="email" type="email" autocomplete="username" required></div><div><label>Senha</label><input id="password" type="password" autocomplete="current-password" required></div><button id="btn">ENTRAR</button></div><div class="links">Ainda não tenho conta → <a href="/ativar/">Ativar minha MasterPET</a></div></div></div><script>const API='https://script.google.com/macros/s/AKfycbzSvScdkpr10U80-imp1zNI-72dN6RvB2eOlMUL40efJdd9eJrDrpwJfV6hCe4SB5w2Zg/exec';const p=new URLSearchParams(location.search);$('email').value=p.get('email')||'';function $(id){return document.getElementById(id)}function show(t,s){$('msg').className='msg '+t;$('msg').textContent=s;$('msg').style.display='block'}function login(){const email=$('email').value.trim().toLowerCase(),password=$('password').value;if(!email||!password){show('err','Informe e-mail e senha.');return}$('btn').disabled=true;$('btn').textContent='ENTRANDO...';const cb='mpcb_'+Date.now();window[cb]=r=>{try{if(r.ok){localStorage.setItem('masterpet_token',r.token);localStorage.setItem('masterpet_tutor',JSON.stringify(r.tutor));location.href='/tutor/'}else show('err',r.error==='INVALID_CREDENTIALS'?'E-mail ou senha inválidos.':'Não foi possível entrar.')}finally{delete window[cb];$('btn').disabled=false;$('btn').textContent='ENTRAR'}};const s=document.createElement('script');s.src=API+'?action=login&email='+encodeURIComponent(email)+'&password='+encodeURIComponent(password)+'&callback='+cb;document.body.appendChild(s);setTimeout(()=>s.remove(),8000)}$('btn').onclick=login;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});</script></body></html>
